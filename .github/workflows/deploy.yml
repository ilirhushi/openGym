name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: api
            context: ./api
            file: ./api/Dockerfile
          - image: web
            context: .
            file: ./web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/ilirhushi/opengym-${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=deploy-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=deploy-${{ matrix.image }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync tracked files to VPS
        uses: burnett01/rsync-deployments@v9
        with:
          switches: >-
            -avz --delete --mkpath
            --exclude=.git
            --exclude=.github
            --exclude=.env
            --exclude=data
            --exclude=media
            --exclude=coach-auth
            --exclude=docker-compose.override.yml
            --exclude=node_modules
            --exclude=frontend/node_modules
            --exclude=frontend/android
            --exclude=frontend/ios
          path: ./
          remote_path: /opt/opengym/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
      - name: Pull this commit's images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -eu
            cd /opt/opengym
            export DEPLOY_TAG=${{ github.sha }}
            set -- -f docker-compose.yml
            if [ -f docker-compose.override.yml ]; then
              set -- "$@" -f docker-compose.override.yml
            fi
            set -- "$@" -f docker-compose.deploy.yml
            docker compose "$@" pull api web
            docker compose "$@" up -d --remove-orphans

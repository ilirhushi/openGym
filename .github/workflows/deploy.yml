name: Deploy

# On push to main: build both images from source and push them to this repo's own
# GHCR namespace (ghcr.io/<owner>/opengym-{api,web}:latest), then sync tracked files
# to the VPS and have it pull those images and restart.
#
# This fork carries its own merged changes on top of upstream, so it can no longer
# just consume upstream's published ghcr.io/duartesantos8/opengym-*:latest images —
# those would be missing everything merged here. docker-compose.yml's api/web image:
# defaults now point at ghcr.io/ilirhushi/opengym-{api,web}:latest (overridable via
# API_IMAGE / WEB_IMAGE), so a plain `docker compose pull` on the VPS picks these up
# with no .env changes needed there.
#
# One-time setup this workflow depends on: VPS_HOST / VPS_USER / VPS_SSH_KEY secrets
# on this repo, and ghcr.io/ilirhushi/opengym-api + -web pullable from the VPS
# (public visibility, or `docker login ghcr.io` there with a read:packages PAT).
#
# .env, ./data, ./media and ./coach-auth are excluded from the sync on purpose: none
# of them are tracked in git, and rsync --delete would wipe them off the VPS otherwise.
on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository_owner }}/opengym-api
  WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/opengym-web

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: ${{ env.API_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: ${{ env.WEB_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Sync repo to VPS
        uses: burnett01/rsync-deployments@v9
        with:
          switches: >-
            -avz --delete --mkpath
            --exclude=.git
            --exclude=.github
            --exclude=.env
            --exclude=data
            --exclude=media
            --exclude=coach-auth
            --exclude=node_modules
            --exclude=frontend/node_modules
            --exclude=frontend/android
            --exclude=frontend/ios
          path: ./
          remote_path: /opt/opengym/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: Pull freshly built images and restart
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/opengym
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
